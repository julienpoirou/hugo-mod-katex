name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.159.0"
          extended: true

      - name: Build sample site
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="${RUNNER_TEMP}/site"
          OUT_DIR="${RUNNER_TEMP}/public"
          mkdir -p "${SITE_DIR}/content" "${SITE_DIR}/assets/renderers" "${SITE_DIR}/layouts/_default" "${SITE_DIR}/_modules"
          ln -s "${GITHUB_WORKSPACE}" "${SITE_DIR}/_modules/hugo-mod-katex"

          cat > "${SITE_DIR}/layouts/_default/single.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/layouts/_default/list.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/hugo.toml" <<'EOF'
          baseURL = "https://example.org/"
          [module]
            [[module.mounts]]
              source = "content"
              target = "content"
            [[module.mounts]]
              source = "assets"
              target = "assets"
            [[module.mounts]]
              source = "layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-katex/layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-katex/assets"
              target = "assets"
          EOF

          cat > "${SITE_DIR}/assets/renderers/formula.txt" <<'EOF'
          \int_0^1 x^2\,dx
          EOF

          B64_SOURCE=$(printf 'a^2 + b^2 = c^2' | base64 -w0)

          cat > "${SITE_DIR}/content/test.md" <<EOF
          ---
          title: "KaTeX test"
          ---

          Inline: {{< katex-inline expr="e^{i\pi} + 1 = 0" />}} in a sentence.

          Block expr: {{< katex expr="\sum_{i=1}^{n} \frac{1}{i^2}" />}}

          Block src: {{< katex src="renderers/formula.txt" />}}

          Block b64: {{< katex b64="${B64_SOURCE}" />}}

          Block inline-body:
          {{< katex >}}
          x = y
          {{< /katex >}}

          Trusted opt-in: {{< katex expr="a" trust="true" />}}
          EOF

          hugo --source "${SITE_DIR}" --destination "${OUT_DIR}"
          PAGE="${OUT_DIR}/test/index.html"

          # Assets are fingerprinted (cache-busting) and injected only once
          # for the whole page.
          grep -oE 'vendor/hugo-mod-katex/hugo-mod-katex\.[0-9a-f]+\.js' "${PAGE}"
          test "$(grep -oE 'vendor/hugo-mod-katex/hugo-mod-katex\.[0-9a-f]+\.js' "${PAGE}" | wc -l)" -eq 1

          # Every injected asset ships a matching Subresource Integrity hash
          # (katex.css, katex.js, mhchem.js, glue css, glue js = 5 assets).
          test "$(grep -c 'integrity="sha256-' "${PAGE}")" -eq 5

          # Fonts referenced by katex.min.css (relative url(fonts/...)) are
          # actually published, at their original unfingerprinted names.
          test -f "${OUT_DIR}/vendor/hugo-mod-katex/fonts/KaTeX_Main-Regular.woff2"

          # The fingerprinted js is actually published at that path.
          JS_PATH=$(grep -oE 'vendor/hugo-mod-katex/hugo-mod-katex\.[0-9a-f]+\.js' "${PAGE}" | head -1)
          test -f "${OUT_DIR}/${JS_PATH}"

          # Six shortcodes (5 block + 1 inline) each produce a wrapper.
          test "$(grep -c 'data-hugo-mod-katex' "${PAGE}")" -eq 6

          # The inline shortcode uses a span so it stays valid inside a <p>.
          grep -q '<span class="hugo-mod-katex hugo-mod-katex-inline"' "${PAGE}"

          # trust is off by default and only true where explicitly opted in.
          test "$(grep -c 'data-trust="false"' "${PAGE}")" -eq 5
          test "$(grep -c 'data-trust="true"' "${PAGE}")" -eq 1

          # The b64 shortcode (4th wrapper, in document order) actually
          # decodes the source: a shell variable inside an unquoted heredoc
          # must expand, not be passed through literally.
          grep -o 'data-source="[^"]*"' "${PAGE}" | sed -n '4p' \
            | sed 's/data-source="//;s/"$//;s/&#43;/+/g' | base64 -d \
            | grep -q '^a\^2 + b\^2 = c\^2$'

          # An empty source must fail the build explicitly.
          cat > "${SITE_DIR}/content/invalid.md" <<'EOF'
          ---
          title: "invalid"
          ---

          {{< katex >}}
          {{< /katex >}}
          EOF
          if hugo --source "${SITE_DIR}" --destination "${RUNNER_TEMP}/public-invalid"; then
            echo "expected the build to fail on an empty shortcode source" >&2
            exit 1
          fi
          rm "${SITE_DIR}/content/invalid.md"

          # Dedicated page for the headless-browser trust/security check:
          # default (trust=false) must not render a clickable href; the
          # explicit trust=true opt-in must.
          cat > "${SITE_DIR}/content/security-test.md" <<'EOF'
          ---
          title: "KaTeX trust test"
          ---

          Untrusted: {{< katex expr="\href{https://evil.example/x}{click}" />}}

          Trusted: {{< katex expr="\href{https://evil.example/x}{click}" trust="true" />}}
          EOF
          hugo --source "${SITE_DIR}" --destination "${OUT_DIR}"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify real rendering in a headless browser
        run: node tests/verify-render.js "${RUNNER_TEMP}/public"
