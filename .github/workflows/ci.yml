name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.159.0"
          extended: true

      - name: Build sample site
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="${RUNNER_TEMP}/site"
          OUT_DIR="${RUNNER_TEMP}/public"
          mkdir -p "${SITE_DIR}/content" "${SITE_DIR}/assets/renderers" "${SITE_DIR}/layouts/_default" "${SITE_DIR}/_modules"
          ln -s "${GITHUB_WORKSPACE}" "${SITE_DIR}/_modules/hugo-mod-katex"

          cat > "${SITE_DIR}/layouts/_default/single.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/layouts/_default/list.html" <<'EOF'
          <!DOCTYPE html>
          <html><body>{{ .Content }}</body></html>
          EOF

          cat > "${SITE_DIR}/hugo.toml" <<'EOF'
          baseURL = "https://example.org/"
          [module]
            [[module.mounts]]
              source = "content"
              target = "content"
            [[module.mounts]]
              source = "assets"
              target = "assets"
            [[module.mounts]]
              source = "layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-katex/layouts"
              target = "layouts"
            [[module.mounts]]
              source = "_modules/hugo-mod-katex/static"
              target = "static"
          EOF

          cat > "${SITE_DIR}/assets/renderers/formula.txt" <<'EOF'
          \int_0^1 x^2\,dx
          EOF

          B64_SOURCE=$(printf 'a^2 + b^2 = c^2' | base64 -w0)

          cat > "${SITE_DIR}/content/test.md" <<EOF
          ---
          title: "KaTeX test"
          ---

          Inline: {{< katex-inline expr="e^{i\pi} + 1 = 0" />}} in a sentence.

          Block expr: {{< katex expr="\sum_{i=1}^{n} \frac{1}{i^2}" />}}

          Block src: {{< katex src="renderers/formula.txt" />}}

          Block b64: {{< katex b64="${B64_SOURCE}" />}}

          Block inline-body:
          {{< katex >}}
          x = y
          {{< /katex >}}

          Trusted opt-in: {{< katex expr="a" trust="true" />}}
          EOF

          hugo --source "${SITE_DIR}" --destination "${OUT_DIR}"
          PAGE="${OUT_DIR}/test/index.html"

          # Assets injected, and only once for the whole page.
          grep -q 'vendor/hugo-mod-katex/hugo-mod-katex.js' "${PAGE}"
          test "$(grep -c 'hugo-mod-katex.js' "${PAGE}")" -eq 1

          # Six shortcodes (5 block + 1 inline) each produce a wrapper.
          test "$(grep -c 'data-hugo-mod-katex' "${PAGE}")" -eq 6

          # The inline shortcode uses a span so it stays valid inside a <p>.
          grep -q '<span class="hugo-mod-katex hugo-mod-katex-inline"' "${PAGE}"

          # trust is off by default and only true where explicitly opted in.
          test "$(grep -c 'data-trust="false"' "${PAGE}")" -eq 5
          test "$(grep -c 'data-trust="true"' "${PAGE}")" -eq 1

          # The b64 shortcode (4th wrapper, in document order) actually
          # decodes the source: a shell variable inside an unquoted heredoc
          # must expand, not be passed through literally.
          grep -o 'data-source="[^"]*"' "${PAGE}" | sed -n '4p' \
            | sed 's/data-source="//;s/"$//;s/&#43;/+/g' | base64 -d \
            | grep -q '^a\^2 + b\^2 = c\^2$'

          # An empty source must fail the build explicitly.
          cat > "${SITE_DIR}/content/invalid.md" <<'EOF'
          ---
          title: "invalid"
          ---

          {{< katex >}}
          {{< /katex >}}
          EOF
          if hugo --source "${SITE_DIR}" --destination "${RUNNER_TEMP}/public-invalid"; then
            echo "expected the build to fail on an empty shortcode source" >&2
            exit 1
          fi
